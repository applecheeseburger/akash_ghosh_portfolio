<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Contact - Akash Ghosh</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
}

/* Stars Background */
.stars {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

/* Sidebar Navigation */
.sidebar {
    position: fixed;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 25px;
    z-index: 100;
}

.nav-item {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(14px);
    transition: 0.35s ease;
}

.nav-icon {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: #cfd2ff;
    stroke-width: 1.7;
    transition: 0.3s ease;
}

.nav-item:hover {
    transform: scale(1.2);
    background: rgba(176,176,255,0.2);
}

.nav-item:hover .nav-icon {
    stroke: white;
}

.nav-item.active {
    transform: scale(1.25);
    background: rgba(167,139,250,0.3);
    box-shadow: 0 0 25px rgba(167,139,250,0.7);
}

.nav-item::after {
    content: attr(data-label);
    position: absolute;
    left: 80px;
    white-space: nowrap;
    font-size: 0.9rem;
    color: #a78bfa;
    opacity: 0;
    transform: translateX(-10px);
    transition: 0.3s;
    pointer-events: none;
}

.nav-item:hover::after {
    opacity: 1;
    transform: translateX(0);
}

/* Main Content */
.main-content {
    flex: 1;
    margin-left: 120px;
    position: relative;
    z-index: 1;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 60px 30px;
}

.page-header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeInUp 0.8s ease;
}

.profile-icon {
    font-size: 3.5rem;
    margin-bottom: 15px;
}

h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #fff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    font-size: 1.2rem;
    color: #a78bfa;
}

.section-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(176,176,255,0.15);
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 25px;
    backdrop-filter: blur(10px);
    transition: 0.3s ease;
}

.section-card:hover {
    transform: translateY(-4px);
    border-color: rgba(167,139,250,0.4);
}

.section-card h2 {
    font-size: 1.4rem;
    color: #a78bfa;
    margin-bottom: 15px;
}

.contact-list {
    list-style: none;
}

.contact-list li {
    padding: 12px 0;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 1.05rem;
    color: #d0d0d0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.contact-list li:last-child {
    border-bottom: none;
}

.contact-list a {
    color: #a78bfa;
    text-decoration: none;
}

.contact-list a:hover {
    text-decoration: underline;
}

.contact-icon {
    font-size: 1.3rem;
    width: 35px;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar {
        position: relative;
        transform: none;
        left: 0;
        top: 0;
        flex-direction: row;
        justify-content: center;
        padding: 20px;
    }
    .main-content { margin-left: 0; }
}
</style>
</head>

<script>
/* Generate Stars */
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
}
</script>
